<style>

  --shadow:0 16px 40px rgba(0,0,0,.28);--shadow-sm:0 4px 15px rgba(0,0,0,.2);
}
*{box-sizing:border-box}

a{color:inherit}
.app-shell{min-height:100vh}
.boot-screen{min-height:100vh;display:grid;place-content:center;text-align:center;gap:10px;padding:24px}

.boot-screen h1{margin:2px 0;font-size:30px}.boot-screen p{margin:0;color:var(--muted)}

.layout{max-width:var(--max);margin:auto;min-height:100vh;padding:0 20px calc(var(--nav-h) + 28px)}
.topbar{height:72px;display:flex;align-items:center;justify-content:space-between;gap:16px;position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid color-mix(in srgb,var(--border) 72%,transparent)}
.brand{display:flex;align-items:center;gap:11px;font-weight:850}.brand .logo{width:38px;height:38px;border-radius:13px;background:linear-gradient(145deg,var(--primary),var(--primary-2));color:#fff;display:grid;place-items:center;font-weight:900}.brand small{display:block;color:var(--muted);font-weight:500;font-size:11px;margin-top:1px}
.top-actions{display:flex;align-items:center;gap:8px}
.icon-btn,.chip,.pill,.ghost-btn,.primary-btn,.danger-btn,.answer-btn{border:0;border-radius:12px;transition:transform .08s,background .15s,border-color .15s,opacity .15s}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;background:var(--surface);color:var(--text);border:1px solid var(--border);box-shadow:var(--shadow-sm)}
.icon-btn:active,.primary-btn:active,.ghost-btn:active,.answer-btn:active{transform:scale(.98)}
.content{padding:26px 0}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:20px}.page-head h1{font-size:clamp(24px,4vw,34px);margin:0}.page-head p{margin:7px 0 0;color:var(--muted)}
.section-title{font-weight:800;margin:26px 2px 11px;font-size:15px;color:var(--muted)}
.grid{display:grid;gap:14px}.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}.grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow-sm)}
.card.interactive{cursor:pointer;text-align:start}.card.interactive:hover{border-color:color-mix(in srgb,var(--primary) 58%,var(--border));transform:translateY(-1px)}
.hero{background:linear-gradient(135deg,color-mix(in srgb,var(--primary) 92%,#061526),color-mix(in srgb,var(--primary-2) 74%,#102138));color:#fff;border:0;padding:26px;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;inset:auto -70px -100px auto;width:240px;height:240px;border-radius:50%;background:rgba(255,255,255,.08)}.hero h2{margin:0;font-size:27px}.hero p{margin:8px 0 20px;color:rgba(255,255,255,.82);max-width:620px}.hero-row{display:flex;align-items:center;justify-content:space-between;gap:18px;position:relative;z-index:1}.hero-metrics{display:flex;gap:20px;flex-wrap:wrap}.hero-metric strong{font-size:22px;display:block}.hero-metric span{font-size:12px;color:rgba(255,255,255,.75)}
.primary-btn,.ghost-btn,.danger-btn{min-height:44px;padding:11px 17px;border-radius:13px;font-weight:800;border:1px solid transparent;display:inline-flex;align-items:center;justify-content:center;gap:8px}.primary-btn{background:var(--primary);color:white}.hero .primary-btn{background:#fff;color:#0f766e}.ghost-btn{background:var(--surface-2);color:var(--text);border-color:var(--border)}.danger-btn{background:var(--danger);color:#fff}.block{width:100%}.large{min-height:52px;padding:14px 22px;font-size:16px}
.stat-card{display:flex;align-items:center;gap:13px}.stat-icon{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--surface-2);font-size:20px}.stat-card strong{font-size:24px;line-height:1}.stat-card span{display:block;color:var(--muted);font-size:13px;margin-top:5px}
.metric-green .stat-icon{background:var(--success-soft);color:var(--success)}.metric-red .stat-icon{background:var(--danger-soft);color:var(--danger)}.metric-amber .stat-icon{background:var(--warning-soft);color:var(--warning)}.metric-blue .stat-icon{background:var(--info-soft);color:var(--info)}
.training-card{display:flex;align-items:center;gap:14px}.training-card .training-icon{width:48px;height:48px;border-radius:15px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;font-size:22px;flex:none}.training-card h3{margin:0 0 4px;font-size:16px}.training-card p{margin:0;color:var(--muted);font-size:13px}
.bottom-nav{position:fixed;z-index:50;bottom:max(10px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(calc(100% - 24px),720px);height:var(--nav-h);display:grid;grid-template-columns:repeat(5,1fr);background:color-mix(in srgb,var(--surface) 92%,transparent);border:1px solid var(--border);border-radius:24px;box-shadow:var(--shadow);backdrop-filter:blur(16px);padding:7px}
.nav-btn{border:0;background:transparent;color:var(--muted);border-radius:17px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:700}.nav-btn svg{width:21px;height:21px}.nav-btn.active{background:var(--primary-soft);color:var(--primary)}

/* Study */
.study-layout{max-width:920px;margin:auto;min-height:100vh;padding:18px 20px 34px}
.study-head{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;margin-bottom:12px}.study-title{text-align:center;font-weight:850;font-size:18px}.study-meta{font-size:12px;color:var(--muted);text-align:left;white-space:nowrap}
.progress-wrap{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.progress{height:9px;background:var(--surface-3);border-radius:999px;overflow:hidden}.progress>span{height:100%;display:block;background:linear-gradient(90deg,var(--primary),var(--primary-2));transition:width .25s}.retry-badge{font-size:12px;color:var(--warning);background:var(--warning-soft);padding:5px 9px;border-radius:999px}
.score-strip{display:flex;justify-content:center;gap:18px;margin:10px 0 18px;font-size:13px}.score-strip .ok{color:var(--success)}.score-strip .no{color:var(--danger)}.score-strip .hint{color:var(--warning)}
.question-card{min-height:210px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px;margin-bottom:16px}.question-label{font-size:13px;color:var(--muted);margin-bottom:13px}.question-ar{font-size:clamp(29px,5vw,42px);font-weight:700;line-height:1.45;direction:rtl;font-family:var(--font-ar);letter-spacing:normal;word-spacing:normal}.question-de{font-size:clamp(29px,5vw,42px);font-weight:850;line-height:1.25;direction:ltr}.pronunciation{font-size:17px;color:var(--muted);margin-top:10px}.word-details{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-top:15px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted);font-size:12px;font-weight:700;border:1px solid var(--border)}.pill.new{background:var(--info-soft);color:var(--info);border-color:transparent}.pill.due{background:var(--warning-soft);color:var(--warning);border-color:transparent}.pill.weak{background:var(--danger-soft);color:var(--danger);border-color:transparent}.pill.mastered{background:var(--success-soft);color:var(--success);border-color:transparent}.pill.review{background:var(--primary-soft);color:var(--primary);border-color:transparent}
.answer-input{width:100%;min-height:72px;resize:vertical;padding:16px 18px;border:2px solid var(--border);border-radius:16px;background:var(--surface);color:var(--text);font-size:24px;direction:ltr;text-align:left;outline:0;font-family:var(--font-de)}
.answer-input::placeholder{direction:rtl;text-align:right;font-family:var(--font-ar);letter-spacing:normal;word-spacing:normal;opacity:.78}.answer-input.arabic-answer{direction:rtl;text-align:right;font-family:var(--font-ar);line-height:1.65}.answer-input:focus{border-color:var(--primary);box-shadow:0 0 0 4px color-mix(in srgb,var(--primary) 13%,transparent)}
.answer-actions{display:grid;grid-template-columns:auto 1fr;gap:10px;margin-top:11px}.answer-actions .primary-btn{justify-self:end;min-width:130px}
.reveal-btn{margin-top:10px;background:transparent;border:0;color:var(--muted);font-weight:700;padding:9px;width:100%}
.choices{display:grid;gap:10px}.answer-btn{width:100%;min-height:58px;text-align:start;padding:14px 16px;background:var(--surface);color:var(--text);border:2px solid var(--border);font-size:17px}.answer-btn:hover{border-color:var(--primary)}.answer-btn.correct{background:var(--success-soft);border-color:var(--success);color:var(--success)}.answer-btn.wrong{background:var(--danger-soft);border-color:var(--danger);color:var(--danger)}.answer-btn.dim{opacity:.46}
.feedback{margin-top:14px;border-radius:16px;padding:17px;border:1px solid var(--border);background:var(--surface)}.feedback.success{background:var(--success-soft);border-color:color-mix(in srgb,var(--success) 40%,transparent)}.feedback.error{background:var(--danger-soft);border-color:color-mix(in srgb,var(--danger) 40%,transparent)}.feedback h3{margin:0 0 8px;font-size:17px}.feedback-row{display:flex;justify-content:space-between;gap:15px;margin-top:7px;font-size:14px}.feedback-row span:first-child{color:var(--muted)}
.rating-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:13px}.rating-btn{border:1px solid var(--border);background:var(--surface);color:var(--text);padding:10px 8px;border-radius:12px;font-weight:800}.rating-btn.again{color:var(--danger)}.rating-btn.hard{color:var(--warning)}.rating-btn.good{color:var(--primary)}.rating-btn.easy{color:var(--success)}
.token-area{min-height:66px;padding:13px;border-radius:15px;background:var(--surface);border:1px solid var(--border);margin-bottom:12px;display:flex;flex-wrap:wrap;gap:7px;align-items:center;direction:ltr}.token-bank{display:flex;flex-wrap:wrap;gap:8px;direction:ltr;margin-bottom:12px}.token{padding:10px 13px;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:12px;font-weight:700}
.intro-card .question-de{margin-top:2px}.intro-meaning{font-size:24px;font-weight:850;margin-top:18px}.intro-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.session-end{text-align:center;max-width:740px;margin:80px auto 0}.end-icon{width:78px;height:78px;border-radius:25px;background:var(--success-soft);color:var(--success);display:grid;place-items:center;font-size:36px;margin:auto}.session-end h1{margin:17px 0 8px}.session-end>p{color:var(--muted);margin:0 0 22px}.end-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}.end-stat{padding:15px;border-radius:15px;background:var(--surface);border:1px solid var(--border)}.end-stat strong{display:block;font-size:24px}.end-stat span{font-size:12px;color:var(--muted)}

/* Words */
.toolbar{display:grid;grid-template-columns:1fr auto auto;gap:9px;margin-bottom:12px}.search-input,.field-input,.field-select,.field-textarea{width:100%;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:13px;padding:12px 14px;outline:0}.search-input:focus,.field-input:focus,.field-select:focus,.field-textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 12%,transparent)}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 11px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chip{white-space:nowrap;padding:8px 13px;border:1px solid var(--border);background:var(--surface);color:var(--muted);font-weight:750}.chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.list-card{padding:0;overflow:hidden}.word-row{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border);cursor:pointer}.word-row:last-child{border-bottom:0}.word-row:hover{background:var(--surface-2)}.word-main{min-width:0}.word-german{font-size:17px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.word-arabic{font-size:13px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.word-side{display:flex;align-items:center;gap:7px}.load-more{display:block;margin:14px auto 0}
.empty{padding:45px 20px;text-align:center;color:var(--muted)}

/* Stats */
.skill-row{margin-bottom:14px}.skill-head{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}.skill-head span{color:var(--muted)}.mini-progress{height:8px;background:var(--surface-3);border-radius:999px;overflow:hidden}.mini-progress span{display:block;height:100%;background:var(--primary)}
.activity-bars{height:150px;display:flex;align-items:flex-end;gap:9px;padding-top:22px}.day-bar{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px}.day-bar .bar{width:100%;max-width:42px;background:linear-gradient(var(--primary-2),var(--primary));border-radius:8px 8px 3px 3px;min-height:3px}.day-bar small{color:var(--muted);font-size:10px}.day-bar b{font-size:10px}

/* Settings & forms */
.settings-group{margin-bottom:16px}.setting-row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:15px;padding:13px 0;border-bottom:1px solid var(--border)}.setting-row:last-child{border-bottom:0}.setting-row strong{font-size:14px}.setting-row p{font-size:12px;color:var(--muted);margin:3px 0 0}.toggle{width:48px;height:28px;border:0;border-radius:999px;background:var(--surface-3);position:relative}.toggle:after{content:"";position:absolute;width:22px;height:22px;top:3px;right:3px;border-radius:50%;background:white;box-shadow:0 2px 5px rgba(0,0,0,.2);transition:right .18s}.toggle.on{background:var(--primary)}.toggle.on:after{right:23px}
.field{margin-bottom:13px}.field label{display:block;font-size:12px;color:var(--muted);font-weight:750;margin-bottom:6px}.field-textarea{min-height:84px;resize:vertical}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}

/* Modal & toast */
.modal-backdrop{position:fixed;inset:0;z-index:100;background:rgba(2,8,23,.64);display:grid;place-items:center;padding:18px;backdrop-filter:blur(4px)}.modal{width:min(100%,620px);max-height:88vh;overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:22px;box-shadow:var(--shadow);padding:20px}.modal-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:17px}.modal-head h2{margin:0;font-size:20px}.modal-close{border:0;background:var(--surface-2);color:var(--muted);border-radius:11px;width:36px;height:36px}.modal-actions{display:flex;gap:9px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
#toast-root{position:fixed;z-index:200;left:16px;bottom:calc(var(--nav-h) + 28px);display:grid;gap:8px}.toast{background:var(--text);color:var(--surface);border-radius:13px;padding:11px 15px;box-shadow:var(--shadow);font-size:13px;animation:toast-in .18s ease-out}.toast.error{background:var(--danger);color:white}.toast.success{background:var(--success);color:white}@keyframes toast-in{from{transform:translateY(8px);opacity:0}}

.quality-box{border:1px solid var(--warning);background:var(--warning-soft);color:var(--warning);border-radius:13px;padding:11px 13px;font-size:13px;margin-bottom:13px}.quality-list{display:grid;gap:8px}.quality-item{padding:12px;border-radius:13px;background:var(--surface-2);border:1px solid var(--border)}.quality-item strong{display:block}.quality-item small{display:block;color:var(--muted);margin-top:4px}
.kbd{font-family:monospace;border:1px solid var(--border);background:var(--surface-2);border-radius:6px;padding:1px 5px;font-size:11px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* Arabic shaping safeguards for iOS Safari / installed web apps */
body,button,select,textarea,.question-ar,.question-label,.intro-meaning,.feedback,.score-strip,.pill,.reveal-btn,.nav-btn,.word-arabic{
  font-family:var(--font-ar);
  letter-spacing:normal;
  word-spacing:normal;
  font-kerning:normal;
  font-variant-ligatures:common-ligatures contextual;
  font-feature-settings:"kern" 1,"liga" 1,"calt" 1;
}
.question-ar,.intro-meaning,.feedback,.word-arabic{direction:rtl;unicode-bidi:isolate}
@supports (-webkit-touch-callout:none){
  .question-ar{font-weight:700}
  .feedback h3,.primary-btn,.ghost-btn,.danger-btn,.rating-btn{font-weight:700}
}

@media(max-width:900px){.grid-4{grid-template-columns:repeat(2,1fr)}.grid-3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){
  :root{--nav-h:68px}.layout{padding-inline:12px}.topbar{height:64px}.brand small{display:none}.content{padding-top:18px}.page-head{align-items:flex-start;flex-direction:column}.hero{padding:21px}.hero-row{align-items:flex-start;flex-direction:column}.hero .primary-btn{width:100%}.grid-2,.grid-3,.grid-4{grid-template-columns:1fr 1fr}.training-grid{grid-template-columns:1fr}.study-layout{padding:12px}.study-head{grid-template-columns:auto 1fr auto}.study-title{font-size:16px}.question-card{min-height:190px;padding:21px 16px}.answer-actions{grid-template-columns:1fr 1fr}.answer-actions .primary-btn{justify-self:stretch}.rating-row{grid-template-columns:1fr 1fr}.end-grid{grid-template-columns:1fr 1fr}.toolbar{grid-template-columns:1fr auto}.toolbar .sort-select{grid-column:1/-1}.form-grid{grid-template-columns:1fr}.intro-actions{grid-template-columns:1fr}.bottom-nav{bottom:max(5px,env(safe-area-inset-bottom));width:calc(100% - 12px);border-radius:20px}.nav-btn{font-size:10px}.top-actions .hide-mobile{display:none}
}
@media(max-width:390px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}.stat-card{min-height:70px}.study-meta{font-size:10px}.score-strip{gap:10px}.word-side .pill{display:none}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}


/* ── شريط التحديث ───────────────────────────── */
.update-banner{
  position:fixed;
  inset-inline:12px;
  bottom:calc(env(safe-area-inset-bottom,0px) + 76px);
  z-index:60;
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  align-items:center;
  justify-content:space-between;
  padding:12px 14px;
  border-radius:14px;
  background:var(--card,#fff);
  color:var(--text,#0f172a);
  box-shadow:0 10px 30px rgba(15,23,42,.18);
  border:1px solid var(--border,rgba(15,23,42,.12));
  font-size:14px;

  function qualityIssues(word){

        return {kind:"test",skill,word,card,entry,prompt:rest,promptLang:"de",expected:word.article,answerLang:"de",label:"اكتب أداة التعريف: der أو die أو das"};
      }
      if(!entry.choiceIds){
        const counts=state.session.choicePositionCounts||(state.session.choicePositionCounts=[0,0,0]);
        const min=Math.min(...counts),positions=counts.map((v,i)=>v===min?i:-1).filter(i=>i>=0);
        const target=positions[DF.randomInt(positions.length)];
        const wrong=DF.shuffle(DF.ARTICLES.filter(x=>x!==word.article));
        const ids=[];let wi=0;for(let i=0;i<3;i++)ids.push(i===target?word.article:wrong[wi++]);
        entry.choiceIds=ids;counts[target]++;
      }
      const choices=entry.choiceIds.map(x=>({id:x,label:x}));
      return {kind:"test",skill,word,card,entry,prompt:rest,promptLang:"de",choices,correctId:word.article,label:"اختر أداة التعريف الصحيحة"};
    }
    if(skill==="order"){
      const cleaned=word.german.replace(/[.!?]+$/g,"").trim();
      if(!entry.tokens)entry.tokens=DF.shuffle(cleaned.split(/\s+/).filter(Boolean));
      return {kind:"test",skill,word,card,entry,prompt:word.arabic,promptLang:"ar",tokens:entry.tokens.slice(),expected:cleaned,answerLang:"de",label:"رتّب كلمات الجملة الألمانية"};
    }
    return {kind:"test",skill:"recall",word,card,entry,prompt:word.arabic,promptLang:"ar",expected:word.german,answerLang:"de",label:word.itemType==="sentence"?"اكتب الجملة بالألمانية كاملة":"اكتب الكلمة أو التركيب بالألمانية"};
  }

  function statusPriority(card,now=Date.now()){
    const s=DF.cardStatus(card,now);return ({overdue:0,due:1,weak:2,learning:3,new:4,mastered:5,ignored:9})[s]??6;
  }

  function learnedWordIds(state){

  }

    const now=Date.now(),seen=new Set();
    let cards=state.cards.filter(c=>!c.suspended&&state.wordsMap.has(c.wordId)&&state.wordsMap.get(c.wordId)?.qualityStatus!=="review");
    if(state.settings.difficultyMode==="hard"&&!state.settings.enableOrderPractice)cards=cards.filter(c=>c.skill!=="order");
    if(skills)cards=cards.filter(c=>skills.includes(c.skill));
    if(weakOnly)cards=cards.filter(c=>DF.cardStatus(c,now)==="weak"||c.lapses>=2||c.wrong>c.correct);
    /* إصلاح: مراجعة الأخطاء تستبعد البطاقات المتقنة حالياً. c.wrong عداد تاريخي
       لا يتصفّر أبداً، فبدون هذا الشرط تبقى الكلمة في قائمة الأخطاء للأبد حتى
       لو أُتقنت فعلاً منذ ذلك الخطأ القديم. */
    else if(mistakesOnly)cards=cards.filter(c=>c.wrong>0&&DF.cardStatus(c,now)!=="mastered");
    else cards=cards.filter(c=>c.dueAt<=now||DF.cardStatus(c,now)==="weak");
    const buckets=new Map();
    for(const c of cards){const p=statusPriority(c,now);if(!buckets.has(p))buckets.set(p,[]);buckets.get(p).push(c);}
    const ordered=[];
    for(const p of Array.from(buckets.keys()).sort((a,b)=>a-b)){
      let bucket=buckets.get(p);
      if(mistakesOnly)bucket=bucket.sort((a,b)=>(b.wrong-b.correct)-(a.wrong-a.correct));
      const windows=[];for(let i=0;i<bucket.length;i+=6)windows.push(...DF.shuffle(bucket.slice(i,i+6)));
      ordered.push(...windows);
    }
    const out=[];for(const c of ordered){if(seen.has(c.wordId))continue;seen.add(c.wordId);out.push(c);if(out.length>=limit)break;}return out;
  }
function pickNewWords(state,limit){
    const learned=learnedWordIds(state);
    const candidates=DF.shuffle(activeWords(state).filter(w=>!learned.has(w.id)));
    const groups={sentence:[],phrase:[],noun:[],word:[]};for(const w of candidates)(groups[w.itemType]||groups.word).push(w);
    const order=DF.shuffle(["sentence","phrase","noun","word"]),out=[];
    while(out.length<limit){let added=false;for(const type of order){const item=groups[type]?.shift();if(item){out.push(item);added=true;if(out.length>=limit)break;}}if(!added)break;}
    return out;
  }
  function hashString(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return h;}


  function randomGap(settings,queueLength){
    const min=Math.max(3,Number(settings.retryGapMin)||5),max=Math.max(min,Number(settings.retryGapMax)||8);
    return Math.min(queueLength,min+DF.randomInt(max-min+1));
  }
  function itemTypeOfEntry(state,entry){return state.wordsMap.get(entry.wordId)?.itemType||"word";}
  function interleaveEntries(state,entries){
    const pool=DF.shuffle(entries),out=[],maxStreak=Math.max(1,Number(state.settings.maxSameItemTypeStreak)||2);

      const previous=out[out.length-1],prevType=previous?itemTypeOfEntry(state,previous):null,prevSkill=previous?.skill||null;
      let streak=0;for(let i=out.length-1;i>=0&&itemTypeOfEntry(state,out[i])===prevType;i--)streak++;
      const candidates=pool.map((e,i)=>{
        const type=itemTypeOfEntry(state,e),wouldExceed=type===prevType&&streak>=maxStreak;
        return {e,i,score:(wouldExceed?1000:0)+(type===prevType?4:0)+((e.skill||e.kind)===prevSkill?2:0)+DF.randomUnit()};
      });
      candidates.sort((a,b)=>a.score-b.score);const pick=candidates[0];out.push(pick.e);pool.splice(pick.i,1);
    }
    return out;
  }
  function avoidPreviousOrder(entries,previousIds){
    if(!Array.isArray(previousIds)||previousIds.length<4||entries.length<4)return entries;
    const ids=entries.map(e=>e.wordId),samePrefix=ids.slice(0,6).filter((id,i)=>id===previousIds[i]).length;
    if(samePrefix<3)return entries;

  }
  function baseSession(mode){return{
    id:DF.makeId("session"),mode,queue:[],current:null,result:null,startedAt:Date.now(),updatedAt:Date.now(),done:false,
    initialCards:0,initialWords:0,initialCompleted:0,introduced:0,attempts:0,correctAttempts:0,wrongAttempts:0,
    firstPassCorrect:0,firstPassWrong:0,reveals:0,hints:0,xp:0,retriesCompleted:0,choicePositionCounts:[0,0,0],engineVersion:6
  };}
  function addInitialTest(session,card){session.queue.push({id:DF.makeId("q"),kind:"test",wordId:card.wordId,skill:card.skill,initial:true,retryCount:0});session.initialCards++;}
  function addIntro(session,word){session.queue.push({id:DF.makeId("intro"),kind:"intro",wordId:word.id,skill:null,initial:false,retryCount:0});session.initialCards++;}

  async function buildSession(state,mode){
    const s=baseSession(mode),settings=state.settings;
    const cap=Math.max(1,settings.sessionSize||20);
    if(mode==="daily"){
      const due=pickDueCards(state,Math.min(settings.reviewsPerDay||40,cap));
      due.forEach(c=>addInitialTest(s,c));
      const remaining=Math.max(0,cap-due.length),newCount=Math.min(settings.newPerDay||12,remaining);
      pickNewWords(state,newCount).forEach(w=>addIntro(s,w));
    }else if(mode==="new"){
      pickNewWords(state,Math.min(cap,settings.newPerDay||12)).forEach(w=>addIntro(s,w));
    }else if(mode==="due"){
      pickDueCards(state,cap).forEach(c=>addInitialTest(s,c));
    }else if(mode==="weak"){
      pickDueCards(state,cap,{weakOnly:true}).forEach(c=>addInitialTest(s,c));
    }else if(mode==="mistakes"){
      pickDueCards(state,cap,{mistakesOnly:true}).forEach(c=>addInitialTest(s,c));
    }else if(mode==="article"){
      const due=pickDueCards(state,cap,{skills:["article"]}),seen=new Set(due.map(c=>c.wordId));
      due.forEach(c=>addInitialTest(s,c));
      const nouns=DF.shuffle(activeWords(state).filter(w=>w.itemType==="noun"&&w.article&&!seen.has(w.id)));

      const due=pickDueCards(state,cap,{skills:["recall"]}),seen=new Set(due.map(c=>c.wordId));

         اختبار الكتابة تدريب استدعاء لما تم تعلّمه فعلاً، وليس مدخلاً لتعليم كلمات جديدة. */
      const learned=learnedWordIds(state);
      const candidates=DF.shuffle(activeWords(state).filter(w=>!seen.has(w.id)&&learned.has(w.id)));
      for(const w of candidates){if(s.initialCards>=cap)break;addInitialTest(s,ensureCardInMemory(state,w.id,"recall"));}
    }else if(mode==="quick"){
      /* إصلاح: الاختبار السريع مراجعة بحتة (مستحق/ضعيف)، ولا يُقحم كلمات جديدة
         لمجرد إكمال العدد. لو العناصر المستحقة أقل من 10، الجلسة تكون أقصر وبس. */
      pickDueCards(state,10).forEach(c=>addInitialTest(s,c));
    }

      const previous=await DF.DB.getMeta("lastSessionWordOrder",[]);
      s.queue=avoidPreviousOrder(s.queue,previous);

  }

  function pendingRetries(session){return session.queue.filter(x=>x.kind==="test"&&!x.initial).length;}

    const planned=Math.max(1,session.initialCards),completed=Math.min(session.initialCompleted,session.initialCards),retries=pendingRetries(session);
    const percent=Math.round(Math.min(1,completed/planned)*100);

  async function beginCurrent(state){
    const s=state.session;if(!s)return null;
    if(s.result)return s.current;

    s.current=questionFor(state,s.queue[0]);s.current.startedAt=Date.now();s.current.usedHint=false;s.current.revealed=false;s.result=null;s.updatedAt=Date.now();await DF.DB.setMeta("session",s);return s.current;
  }

  function evaluateChoice(question,id){
    const ok=String(id)===String(question.correctId);
    return {type:ok?"perfect":"wrong",isCorrect:ok,correctAnswer:question.skill==="recognition"?question.word.arabic:question.correctId,userAnswer:id,note:ok?"إجابة صحيحة.":question.skill==="article"?`الأداة الصحيحة: ${question.correctId}.`:"الإجابة غير صحيحة.",quality:ok?1:0};
  }

    else if(q.skill==="recognition")answer=DF.validateArabicAnswer(payload.text,q.word,q.expected,state.settings);

    const suggestedRating=DF.automaticRating(answer,{usedHint:q.usedHint,revealed:false,elapsedMs:elapsed});

    s.updatedAt=Date.now();await DF.DB.setMeta("session",s);
  }
  async function revealAnswer(state){

    q.revealed=true;

  }

    const s=state.session,q=s?.current;if(!s||!q||q.usedHint)return;

  async function introduceWord(state,known=false){

  function ratingName(r){return({1:"again",2:"hard",3:"good",4:"easy"})[r]||"good";}

    await DF.DB.add("attempts",{
      sessionId:s.id,wordId:q.word.id,cardKey:card.key,skill:q.skill,correct,answerType:r.answer.type,rating:finalRating,

        const skill=unlocks[i],existing=cardFor(state,q.word.id,skill);

  }

})();

  }
  function xmlText(bytes){return new TextDecoder("utf-8").decode(bytes)}
  function parseXML(text){const doc=new DOMParser().parseFromString(text,"application/xml");if(doc.querySelector("parsererror"))throw new Error("تعذر قراءة XML داخل XLSX.");return doc;}
  function colIndex(ref){let n=0;for(const c of (ref.match(/[A-Z]+/i)?.[0]||"A").toUpperCase())n=n*26+(c.charCodeAt(0)-64);return n-1;}
  async function parseXLSX(buffer){
    const files=await unzip(buffer),shared=[];
    if(files.has("xl/sharedStrings.xml")){
      const doc=parseXML(xmlText(files.get("xl/sharedStrings.xml")));
      for(const si of doc.getElementsByTagName("si"))shared.push(Array.from(si.getElementsByTagName("t")).map(x=>x.textContent||"").join(""));
    }
    let sheetPath="xl/worksheets/sheet1.xml";
    if(!files.has(sheetPath))sheetPath=Array.from(files.keys()).find(k=>/^xl\/worksheets\/sheet\d+\.xml$/.test(k));
    if(!sheetPath)throw new Error("لا توجد ورقة عمل قابلة للقراءة داخل الملف.");
    const doc=parseXML(xmlText(files.get(sheetPath))),rows=[];
    for(const rowNode of doc.getElementsByTagName("row")){
      const row=[];
      for(const c of rowNode.getElementsByTagName("c")){
        const idx=colIndex(c.getAttribute("r")||"A1"),type=c.getAttribute("t"),v=c.getElementsByTagName("v")[0]?.textContent??"";
        let value=v;
        if(type==="s")value=shared[Number(v)]??"";
        else if(type==="inlineStr")value=Array.from(c.getElementsByTagName("t")).map(x=>x.textContent||"").join("");
        row[idx]=value;
      }
      rows.push(row.map(x=>x??""));
    }
    return rows.filter(r=>r.some(x=>String(x).trim()));
  }

  function mapRows(rows,state){
    if(!rows.length)return {items:[],stats:{read:0,duplicates:0,invalid:0}};
    const header=rows[0].map(h=>String(h||"").trim());
    const find=(re)=>header.findIndex(x=>re.test(x));
    const de=find(/ألماني|الماني|german|deutsch|الكلمة/i),ar=find(/عرب|arabic|معنى|الترجمة/i),pr=find(/نطق|pron/i),level=find(/level|cefr|مستوى/i),tags=find(/tag|تصنيف|موضوع/i),plural=find(/plural|جمع/i);
    const hasHeader=de>=0||ar>=0;const start=hasHeader?1:0,D=de>=0?de:0,A=ar>=0?ar:1,P=pr>=0?pr:2;
    const existing=new Set(state.words.map(w=>`${w.normalizedGerman}|${w.normalizedArabic}`));
    const seen=new Set(),items=[];let duplicates=0,invalid=0,maxId=state.words.reduce((m,w)=>Math.max(m,Number(w.id)||0),0);
    for(let i=start;i<rows.length;i++){
      const r=rows[i],g=String(r[D]??"").trim(),a=String(r[A]??"").trim(),p=String(r[P]??"").trim();
      if(!g&&!a)continue;if(!g||!a){invalid++;continue;}
      const key=`${DF.normalizeGerman(g)}|${DF.normalizeArabic(a)}`;if(existing.has(key)||seen.has(key)){duplicates++;continue;}seen.add(key);
      const split=DF.splitArticle(g),itemType=DF.inferItemType(g,split.article);
      const word={id:++maxId,german:g,arabic:a,pronunciation:p,normalizedGerman:DF.normalizeGerman(g),normalizedArabic:DF.normalizeArabic(a),itemType,article:split.article,plural:plural>=0?String(r[plural]??"").trim():"",level:level>=0?String(r[level]??"").trim():"",tags:tags>=0?String(r[tags]??"").split(/[;,|]/).map(x=>x.trim()).filter(Boolean):[],acceptedAnswers:[],acceptedArabicAnswers:[],sourceRow:i+1,favorite:false,ignored:false,createdAt:Date.now(),updatedAt:Date.now(),qualityStatus:"ok",qualityIssues:[],qualityNote:"مستورد بواسطة المستخدم"};
      word.qualityIssues=DF.qualityIssues(word);word.qualityStatus=word.qualityIssues.length?"review":"ok";items.push(word);
    }
    return {items,stats:{read:Math.max(0,rows.length-start),duplicates,invalid,added:items.length},columns:{de:D,ar:A,pr:P}};
  }

  async function readImportFile(file,state){
    if(!file)throw new Error("لم يتم اختيار ملف.");
    const name=file.name.toLowerCase();let rows;
    if(name.endsWith(".csv")||name.endsWith(".tsv"))rows=parseCSV(await file.text());
    else if(name.endsWith(".xlsx")){assertXlsxSupported();rows=await parseXLSX(await file.arrayBuffer());}
    else throw new Error("الصيغ المدعومة هي XLSX وCSV فقط.");
    return mapRows(rows,state);
  }
  async function commitImport(state,preview){
    if(!preview?.items?.length)return 0;await DF.DB.bulkPut("words",preview.items);
    state.words.push(...preview.items);for(const w of preview.items)state.wordsMap.set(w.id,w);return preview.items.length;
  }

  async function exportBackup(state){
    const attempts=await DF.DB.getAll("attempts");
    const payload={app:"DeutschFlow",schemaVersion:DF.SETTINGS_SCHEMA,appVersion:DF.VERSION,build:DF.BUILD,dbVersion:DF.DB.DB_VERSION,engineVersion:DF.ENGINE_VERSION,exportedAt:Date.now(),words:state.words,cards:state.cards,attempts,settings:state.settings,profile:state.profile};
    DF.downloadBlob(new Blob([JSON.stringify(payload,null,2)],{type:"application/json"}),`DeutschFlow-backup-${DF.localDateKey()}.json`);
  }
  async function savePreRestoreSnapshot(){
    try{await DF.DB.setMeta("preRestoreSnapshot",{app:"DeutschFlow",schemaVersion:DF.SETTINGS_SCHEMA,appVersion:DF.VERSION,exportedAt:Date.now(),reason:"automatic-pre-restore",words:await DF.DB.getAll("words"),cards:await DF.DB.getAll("cards"),attempts:await DF.DB.getAll("attempts"),settings:await DF.DB.getMeta("settings",{}),profile:await DF.DB.getMeta("profile",{})});}
    catch(e){console.warn("تعذر حفظ لقطة ما قبل الاستعادة",e);}
  }
  async function restoreBackup(file){
    if(!file)throw new Error("لم يتم اختيار ملف.");let payload;
    try{payload=JSON.parse(await file.text());}catch{throw new Error("ملف النسخة الاحتياطية غير صالح.");}
    if(payload.app!=="DeutschFlow"||!Array.isArray(payload.words)||!Array.isArray(payload.cards))throw new Error("هذا الملف ليس نسخة DeutschFlow صحيحة.");
    await savePreRestoreSnapshot();await DF.DB.replaceAll(payload);return payload;
  }
  function exportCSV(state,filter="all"){
    let words=state.words;
    if(filter==="weak")words=words.filter(w=>DF.wordStatus(w,state.cards)==="weak");
    if(filter==="quality")words=words.filter(w=>w.qualityStatus==="review");
    const head=["German","Arabic","Pronunciation","Article","Plural","Type","Level","Tags","Status","Mastery","Quality Issues"];
    const rows=words.map(w=>{
      const mastery=DF.wordMastery(w,state.cards),status=DF.wordStatus(w,state.cards);
      return [w.german,w.arabic,w.pronunciation,w.article,w.plural,w.itemType,w.level,(w.tags||[]).join("; "),status,mastery,(w.qualityIssues||[]).join("; ")].map(DF.csvCell).join(",");
    });
    DF.downloadBlob(new Blob(["\uFEFF"+head.join(",")+"\n"+rows.join("\n")],{type:"text/csv;charset=utf-8"}),`DeutschFlow-words-${filter}-${DF.localDateKey()}.csv`);
  }


  /* ── سياسة الاحتفاظ بسجل المحاولات ───────────────────────────────────
     معطّلة افتراضياً (attemptRetentionDays = 0). لا تُحذف أي محاولة أثناء
     الترقية أو الإقلاع إلا إذا فعّل المستخدم الخيار صراحةً وحُفظت نسخة
     احتياطية أولاً. الحذف اليدوي ينزّل ملف JSON قبل أي حذف. */
  const PRUNE_SNAPSHOT_KEY="prePruneSnapshot";

  function retentionCutoff(settings){
    const days=Number(settings&&settings.attemptRetentionDays)||0;
    if(days<=0)return null;
    return Date.now()-days*DF.DAY;
  }

  async function attemptRetentionPreview(settings){
    const cutoff=retentionCutoff(settings);
    const total=await DF.DB.countAttempts();
    if(cutoff==null)return {enabled:false,total,removable:0,cutoff:null};
    const old=await DF.DB.getAttemptsBefore(cutoff);
    return {enabled:true,total,removable:old.length,cutoff};
  }

  async function savePrePruneSnapshot(reason){
    const snapshot={
      app:"DeutschFlow",schemaVersion:DF.SETTINGS_SCHEMA,appVersion:DF.VERSION,
      exportedAt:Date.now(),reason:reason||"automatic-pre-prune",
      words:await DF.DB.getAll("words"),cards:await DF.DB.getAll("cards"),
      attempts:await DF.DB.getAll("attempts"),
      settings:await DF.DB.getMeta("settings",{}),profile:await DF.DB.getMeta("profile",{})
    };
    await DF.DB.setMeta(PRUNE_SNAPSHOT_KEY,snapshot);
    return snapshot;
  }

  /* التنظيف اليدوي: ينزّل نسخة JSON كاملة ثم يحذف المحاولات الأقدم فقط. */
  async function pruneAttempts(state,{downloadBackup=true,reason="manual"}={}){
    const settings=state.settings||{};
    const cutoff=retentionCutoff(settings);
    if(cutoff==null)throw new Error("سياسة الاحتفاظ معطّلة. حدد عدد أيام الاحتفاظ أولاً (أكبر من صفر).");
    const doomed=await DF.DB.getAttemptsBefore(cutoff);
    if(!doomed.length)return {removed:0,cutoff,backedUp:false};

    const snapshot=await savePrePruneSnapshot(reason);
    if(downloadBackup){
      DF.downloadBlob(
        new Blob([JSON.stringify(snapshot,null,2)],{type:"application/json"}),
        `DeutschFlow-pre-prune-${DF.localDateKey()}.json`
      );
    }
    await DF.DB.bulkDelete("attempts",doomed.map(a=>a.id));
    await DF.DB.setMeta("lastPrune",{at:Date.now(),removed:doomed.length,cutoff,reason});
    return {removed:doomed.length,cutoff,backedUp:true};
  }

  /* يُستدعى عند الإقلاع. لا يفعل شيئاً ما لم يفعّل المستخدم الخيارين معاً. */
  async function autoPruneIfEnabled(state){
    const settings=state.settings||{};
    if(settings.autoPruneAttempts!==true)return {removed:0,skipped:"disabled"};
    if(!(Number(settings.attemptRetentionDays)>0))return {removed:0,skipped:"no-retention"};
    const result=await pruneAttempts(state,{downloadBackup:false,reason:"automatic-boot"});
    return result;
  }

  Object.assign(DF,{IO:{parseCSV,parseXLSX,readImportFile,commitImport,exportBackup,restoreBackup,exportCSV,xlsxSupported,assertXlsxSupported,XLSX_UNSUPPORTED_MESSAGE,attemptRetentionPreview,pruneAttempts,autoPruneIfEnabled,savePrePruneSnapshot,retentionCutoff}});
})();

</script>
<script>
/* src/ui.js */
/* DeutschFlow — presentation module (5/6)

(function(){

    stats:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',

    plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>'
  };

  function toast(message,type=""){const root=document.getElementById("toast-root"),el=document.createElement("div");el.className=`toast ${type}`;el.textContent=message;root.appendChild(el);setTimeout(()=>el.remove(),2600);}
  function modal(html){document.getElementById("modal-root").innerHTML=`<div class="modal-backdrop" data-action="modal-backdrop"><section class="modal" role="dialog" aria-modal="true">${html}</section></div>`;}
  function closeModal(){document.getElementById("modal-root").innerHTML="";}

  /* شريط التحديث — يظهر فقط خارج الجلسة، ويطبّق التحديث بطلب المستخدم. */
  function showUpdateBanner(){
    if(document.getElementById("update-banner"))return;
    const el=document.createElement("div");
    el.id="update-banner";
    el.className="update-banner";
    el.setAttribute("role","status");
    el.innerHTML=`<span>يتوفر إصدار جديد من التطبيق.</span><div class="update-banner-actions"><button class="ghost-btn" data-action="dismiss-update">لاحقاً</button><button class="primary-btn" data-action="apply-update">تحديث الآن</button></div>`;
    document.body.appendChild(el);
  }
  function hideUpdateBanner(){document.getElementById("update-banner")?.remove();}
  function statusLabel(s){return({new:"جديدة",learning:"قيد التعلم",due:"مستحقة",overdue:"متأخرة",weak:"ضعيفة",mastered:"متقنة",ignored:"مستبعدة"})[s]||s;}
  function statusPill(s){const cls=s==="overdue"?"weak":s;return `<span class="pill ${cls}">${statusLabel(s)}</span>`;}
  function routeLabel(route){return({home:"الرئيسية",words:"الكلمات",study:"تعلّم",stats:"الإحصائيات",settings:"الإعدادات"})[route]||route;}
  function modeLabel(mode){return({daily:"جلسة اليوم",new:"كلمات جديدة",due:"المراجعات المستحقة",weak:"الكلمات الضعيفة",mistakes:"مراجعة الأخطاء",article:"اختبار الأدوات",writing:"اختبار الكتابة",quick:"اختبار سريع"})[mode]||"جلسة تعلم";}

  function applyTheme(settings){const dark=settings.theme==="dark"||(settings.theme==="auto"&&matchMedia("(prefers-color-scheme:dark)").matches);document.documentElement.dataset.theme=dark?"dark":"light";document.querySelector('meta[name="theme-color"]')?.setAttribute("content",dark?"#08101f":"#0f766e");}

  function render(state){
    applyTheme(state.settings);
    const app=document.getElementById("app");
    if(state.route==="study"){app.innerHTML=renderStudy(state);afterRender(state);return;}
    app.innerHTML=`<div class="layout">${renderTopbar(state)}<main class="content">${renderPage(state)}</main></div>${renderNav(state)}`;
    afterRender(state);
  }
  function renderTopbar(state){return `<header class="topbar"><div class="brand"><span class="logo">DF</span><div>DeutschFlow<small>تعلّم الألمانية بذكاء</small></div></div><div class="top-actions"><button class="icon-btn" data-action="cycle-theme" title="تغيير المظهر">${ICONS.sun}</button>${state.installPrompt?'<button class="ghost-btn hide-mobile" data-action="install-app">تثبيت التطبيق</button>':''}</div></header>`;}
  function renderNav(state){const routes=[["home",ICONS.home,"الرئيسية"],["words",ICONS.words,"الكلمات"],["study",ICONS.study,"تعلّم"],["stats",ICONS.stats,"الإحصائيات"],["settings",ICONS.settings,"الإعدادات"]];return `<nav class="bottom-nav">${routes.map(([r,i,l])=>`<button class="nav-btn ${state.route===r?'active':''}" data-action="nav" data-route="${r}">${i}<span>${l}</span></button>`).join("")}</nav>`;}
  function renderPage(state){if(state.route==="words")return renderWords(state);if(state.route==="stats")return renderStats(state);if(state.route==="settings")return renderSettings(state);return renderHome(state);}

  function dashboardStats(state){
    const counts={new:0,learning:0,due:0,overdue:0,weak:0,mastered:0,ignored:0};
    for(const w of state.words){counts[DF.wordStatus(w,state.cards)]++;}
    return counts;
  }
  function renderHome(state){
    const c=dashboardStats(state),dueCards=state.cards.filter(x=>!x.suspended&&x.dueAt<=Date.now()).length,quality=state.words.filter(w=>w.qualityStatus==="review").length;
    const resume=state.session&&!state.session.done?`<div class="card" style="margin-bottom:14px;border-inline-start:4px solid var(--warning)"><div class="hero-row"><div><strong>جلسة غير مكتملة</strong><p style="margin:4px 0 0;color:var(--muted);font-size:13px">${modeLabel(state.session.mode)} · ${state.session.initialCompleted} من ${state.session.initialCards} عناصر أساسية</p></div><button class="primary-btn" data-action="resume-session">متابعة</button></div></div>`:"";
    return `<section class="page-head"><div><h1>مرحباً، لنبدأ المراجعة</h1><p>الأسئلة والتكرار يتكيفان مع مستوى كل مهارة بصورة مستقلة.</p></div></section>
      ${resume}
      <section class="card hero"><div class="hero-row"><div><h2>جلسة اليوم</h2><p>المستحق أولاً، ثم الكلمات الجديدة. النطق لا يظهر في سؤال الاستدعاء إلا عند طلب التلميح.</p><div class="hero-metrics"><div class="hero-metric"><strong>${dueCards.toLocaleString("ar-EG")}</strong><span>بطاقة مستحقة</span></div><div class="hero-metric"><strong>${state.settings.newPerDay}</strong><span>كلمة جديدة مستهدفة</span></div><div class="hero-metric"><strong>${state.profile.streak||0}</strong><span>يوم متتالٍ</span></div></div></div><button class="primary-btn large" data-action="start-session" data-mode="daily">ابدأ الجلسة</button></div></section>
      <div class="section-title">نظرة عامة</div><section class="grid grid-4">
        ${statCard("✦",c.new,"جديدة","metric-blue")}${statCard("↻",c.due+c.overdue,"مستحقة","metric-amber")}${statCard("!",c.weak,"ضعيفة","metric-red")}${statCard("✓",c.mastered,"متقنة","metric-green")}
      </section>
      <div class="section-title">تدريبات مخصصة</div><section class="grid grid-3 training-grid">
        ${trainingCard("✍","اختبار الكتابة","استدعاء العربية وكتابة الألمانية دون كشف الإجابة","writing")}
        ${trainingCard("D","اختبار الأدوات","تدريب مستقل على der / die / das","article")}
        ${trainingCard("⏱","اختبار سريع","عشر بطاقات من أهم ما يحتاج إلى مراجعة","quick")}
        ${trainingCard("↻","المراجعات المستحقة","البطاقات التي حان موعدها فقط","due")}
        ${trainingCard("!","الكلمات الضعيفة","الأكثر تعثراً وفق سجل المحاولات","weak")}
        ${trainingCard("×","مراجعة الأخطاء","البطاقات ذات الأخطاء السابقة","mistakes")}
      </section>
      ${quality?`<div class="section-title">جودة البيانات</div><section class="card"><div class="hero-row"><div><strong>${quality.toLocaleString("ar-EG")} مدخلاً يحتاج إلى مراجعة</strong><p style="color:var(--muted);margin:5px 0 0;font-size:13px">تم اكتشافها بقواعد تحقق هيكلية؛ لا يعني ذلك أن جميعها خاطئة لغوياً.</p></div><button class="ghost-btn" data-action="quality-review">فتح المراجعة</button></div></section>`:""}`;
  }
  function statCard(icon,n,label,cls=""){return `<div class="card stat-card ${cls}"><span class="stat-icon">${icon}</span><div><strong>${Number(n||0).toLocaleString("ar-EG")}</strong><span>${label}</span></div></div>`;}
  function trainingCard(icon,title,desc,mode){return `<button class="card interactive training-card" data-action="start-session" data-mode="${mode}"><span class="training-icon">${icon}</span><span><h3>${title}</h3><p>${desc}</p></span></button>`;}

  function getFilteredWords(state){
    const v=state.wordView,q=DF.normalizeGerman(v.query||""),qa=DF.normalizeArabic(v.query||"");let list=state.words.slice();
    if(q||qa)list=list.filter(w=>w.normalizedGerman.includes(q)||w.normalizedArabic.includes(qa)||(w.pronunciation||"").includes(v.query));
    list=list.filter(w=>{const s=DF.wordStatus(w,state.cards);if(v.filter==="all")return true;if(v.filter==="favorite")return w.favorite;if(v.filter==="quality")return w.qualityStatus==="review";if(v.filter==="noun")return w.itemType==="noun";if(v.filter==="due")return s==="due"||s==="overdue";return s===v.filter;});
    if(v.sort==="alpha")list.sort((a,b)=>a.normalizedGerman.localeCompare(b.normalizedGerman,"de"));
    if(v.sort==="mastery")list.sort((a,b)=>DF.wordMastery(a,state.cards)-DF.wordMastery(b,state.cards));
    if(v.sort==="errors")list.sort((a,b)=>wordErrors(state,b.id)-wordErrors(state,a.id));
    if(v.sort==="recent")list.sort((a,b)=>b.updatedAt-a.updatedAt);
    return list;
  }
  function wordErrors(state,id){return state.cards.filter(c=>c.wordId===id).reduce((s,c)=>s+(c.wrong||0),0);}
  function renderWords(state){
    const list=getFilteredWords(state),shown=list.slice(0,state.wordView.limit);
