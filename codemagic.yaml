# Codemagic CI — DeutschFlow
#
# Gate 5 preparation. The default workflow validates that the Capacitor iOS project can
# be generated and compiled on a real Mac, WITHOUT requiring Apple signing credentials,
# so it can run today. Device installation and signing live in a separate workflow that
# stays inactive until credentials are configured.
#
# Repository facts this config depends on (verified against the repo and the installed
# Capacitor CLI, not assumed):
#   - package.json and capacitor.config.json are at the repository ROOT
#   - the web app (Capacitor webDir) is 01_APPLICATION/CURRENT_APP
#   - the test suite is `npm test` (vitest)
#   - ios/ is generated on the build machine; it is not committed
#
# Capacitor 8 generates a SWIFT PACKAGE MANAGER project, not a CocoaPods one
# (see @capacitor/cli/assets/ios-spm-template.tar.gz). That means:
#   - there is NO Podfile and NO .xcworkspace
#   - the Xcode project is ios/App/App.xcodeproj
#   - native dependencies live in ios/App/CapApp-SPM/Package.swift, which the CLI
#     rewrites on every `cap sync`
# CocoaPods is deliberately not requested or used anywhere below.
#
# Toolchain: Capacitor 8 requires Xcode 26.0+ and Node 22+.

definitions:
  scripts:
    - &verify_toolchain
      name: Verify toolchain meets Capacitor 8 requirements
      script: |
        set -e
        echo "Node:  $(node --version)"
        echo "npm:   $(npm --version)"
        echo "Xcode: $(xcodebuild -version | head -1)"
        NODE_MAJOR=$(node -p "process.versions.node.split('.')[0]")
        if [ "$NODE_MAJOR" -lt 22 ]; then
          echo "ERROR: Capacitor 8 requires Node 22+, found $(node --version)"
          exit 1
        fi
        XCODE_MAJOR=$(xcodebuild -version | head -1 | sed -E 's/Xcode ([0-9]+).*/\1/')
        if [ "$XCODE_MAJOR" -lt 26 ]; then
          echo "ERROR: Capacitor 8 requires Xcode 26.0+, found $(xcodebuild -version | head -1)"
          exit 1
        fi

    - &install_dependencies
      name: Install dependencies
      script: |
        set -e
        # package.json lives at the repository root, alongside capacitor.config.json.
        npm ci

    - &run_tests
      name: Run the regression suite
      script: |
        set -e
        # The full suite must pass before any native work is attempted.
        npm test

    - &assert_native_storage_off
      name: Assert native SQLite storage stays disabled
      script: |
        set -e
        # Gate 5 validates that the native project builds, NOT that learner data moves.
        # The persistence bootstrap must still default to IndexedDB.
        BOOTSTRAP=01_APPLICATION/CURRENT_APP/src/platform/bootstrap-persistence.js
        if ! grep -q "nativeStorageEnabled = false" "$BOOTSTRAP"; then
          echo "ERROR: nativeStorageEnabled is no longer defaulted to false in $BOOTSTRAP"
          exit 1
        fi
        echo "OK: nativeStorageEnabled defaults to false (IndexedDB remains active)"

    - &generate_ios_platform
      name: Generate the Capacitor iOS platform
      script: |
        set -e
        # Uses the committed capacitor.config.json (appId, webDir, CapacitorSQLite config).
        npx cap --version
        if [ -d ios ]; then
          echo "ios/ already present, reusing it"
        else
          npx cap add ios
        fi

    - &sync_ios
      name: Sync web assets and native dependencies
      script: |
        set -e
        # cap sync copies webDir into the native project and regenerates
        # ios/App/CapApp-SPM/Package.swift with every SPM-capable plugin.
        npx cap sync ios

    - &verify_native_integration
      name: Verify SPM integration and web assets
      script: |
        set -e
        PKG=ios/App/CapApp-SPM/Package.swift
        PROJ=ios/App/App.xcodeproj

        test -f "$PKG" || { echo "ERROR: $PKG missing; the SPM project was not generated"; exit 1; }
        test -d "$PROJ" || { echo "ERROR: $PROJ missing; the Xcode project was not generated"; exit 1; }
        echo "OK: SPM project generated"

        echo "--- generated Package.swift ---"
        cat "$PKG"
        echo "-------------------------------"

        # The plugin must be declared as a package dependency. The Capacitor CLI writes
        # .package(name: "<iosName>", path: "...") for each SPM-capable plugin, and the
        # iOS package name for @capacitor-community/sqlite is CapacitorCommunitySqlite
        # (matching the product/library name in that plugin's own Package.swift).
        if ! grep -q 'package(name: "CapacitorCommunitySqlite"' "$PKG"; then
          echo "ERROR: @capacitor-community/sqlite is not in the SPM dependency graph."
          echo "The Capacitor CLI only WARNS when a plugin lacks SPM support, so this must fail here."
          exit 1
        fi
        echo "OK: CapacitorCommunitySqlite declared as an SPM package dependency"

        # Declaring it is not enough: it must also be linked into the app target.
        if ! grep -q 'product(name: "CapacitorCommunitySqlite", package: "CapacitorCommunitySqlite")' "$PKG"; then
          echo "ERROR: CapacitorCommunitySqlite is declared but not linked to the CapApp-SPM target"
          exit 1
        fi
        echo "OK: CapacitorCommunitySqlite linked to the app target"

        # An SPM project should carry no CocoaPods artefacts.
        if [ -f ios/App/Podfile ] || [ -d ios/App/App.xcworkspace ]; then
          echo "WARNING: CocoaPods artefacts found in what should be an SPM project"
        fi

        # The web assets must have been copied into the native bundle.
        test -f ios/App/App/public/index.html || {
          echo "ERROR: web assets were not copied into the iOS project"; exit 1;
        }
        echo "OK: web assets copied from 01_APPLICATION/CURRENT_APP"

    - &resolve_packages
      name: Resolve Swift package dependencies
      script: |
        set -e
        # Fetches capacitor-swift-pm plus the plugin's transitive packages
        # (SQLCipher.swift, ZIPFoundation) before the compile step.
        xcodebuild -resolvePackageDependencies \
          -project ios/App/App.xcodeproj \
          -scheme App \
          -clonedSourcePackagesDirPath build/spm-cache

    - &compile_unsigned
      name: Compile the iOS project (unsigned)
      script: |
        set -e
        # Simulator SDK plus disabled code signing, so this validates that the project
        # compiles without any Apple credentials. An SPM project has no .xcworkspace,
        # so this targets App.xcodeproj directly.
        xcodebuild \
          -project ios/App/App.xcodeproj \
          -scheme App \
          -configuration Debug \
          -sdk iphonesimulator \
          -destination 'generic/platform=iOS Simulator' \
          -derivedDataPath build/ios-derived \
          -clonedSourcePackagesDirPath build/spm-cache \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          build | tee build/xcodebuild.log
        echo "OK: Xcode project compiled"

workflows:
  ios-capacitor-validation:
    name: iOS Capacitor Validation (unsigned)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      # Capacitor 8 minimums: Xcode 26.0+, Node 22+.
      # No cocoapods key: the generated project is Swift Package Manager based.
      xcode: 26.4
      node: 22
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: mobile-foundation
          include: true
          source: true
    scripts:
      - *verify_toolchain
      - *install_dependencies
      - *run_tests
      - *assert_native_storage_off
      - name: Prepare build output directory
        script: mkdir -p build
      - *generate_ios_platform
      - *sync_ios
      - *verify_native_integration
      - *resolve_packages
      - *compile_unsigned
    artifacts:
      - build/xcodebuild.log
      - ios/App/CapApp-SPM/Package.swift
    publishing:
      email:
        recipients:
          - mohammedyoussef8187@gmail.com
        notify:
          success: true
          failure: true

  # Not triggered automatically. Enable only after Apple signing credentials are
  # configured in Codemagic (ios_signing certificate + provisioning profile, and a
  # real bundle identifier replacing the com.deutschflow.app placeholder).
  ios-signed-device-build:
    name: iOS Signed Device Build (requires Apple credentials)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: 26.4
      node: 22
      groups:
        - appstore_credentials
      ios_signing:
        distribution_type: development
        bundle_identifier: com.deutschflow.app
    scripts:
      - *verify_toolchain
      - *install_dependencies
      - *run_tests
      - *assert_native_storage_off
      - name: Prepare build output directory
        script: mkdir -p build
      - *generate_ios_platform
      - *sync_ios
      - *verify_native_integration
      - *resolve_packages
      - name: Apply signing profiles
        script: xcode-project use-profiles
      - name: Build signed .ipa
        script: |
          set -e
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
