# Codemagic CI — DeutschFlow
#
# Gate 5 preparation. The default workflow validates that the Capacitor iOS project can
# be generated and compiled on a real Mac, WITHOUT requiring Apple signing credentials,
# so it can run today. Device installation and signing live in a separate workflow that
# stays inactive until credentials are configured.
#
# Repository facts this config depends on (verified against the repo and the installed
# Capacitor CLI, not assumed):
#   - package.json and capacitor.config.json are at the repository ROOT
#   - the web app (Capacitor webDir) is 01_APPLICATION/CURRENT_APP
#   - the test suite is `npm test` (vitest)
#   - ios/ is generated on the build machine; it is not committed
#
# Capacitor 8 generates a SWIFT PACKAGE MANAGER project, not a CocoaPods one
# (see @capacitor/cli/assets/ios-spm-template.tar.gz). That means:
#   - there is NO Podfile and NO .xcworkspace
#   - the Xcode project is ios/App/App.xcodeproj
#   - native dependencies live in ios/App/CapApp-SPM/Package.swift, which the CLI
#     rewrites on every `cap sync`
# CocoaPods is deliberately not requested or used anywhere below.
#
# Toolchain: Capacitor 8 requires Xcode 26.0+ and Node 22+.

definitions:
  scripts:
    - &verify_toolchain
      name: Verify toolchain meets Capacitor 8 requirements
      script: |
        set -e
        echo "Node:  $(node --version)"
        echo "npm:   $(npm --version)"
        echo "Xcode: $(xcodebuild -version | head -1)"
        NODE_MAJOR=$(node -p "process.versions.node.split('.')[0]")
        if [ "$NODE_MAJOR" -lt 22 ]; then
          echo "ERROR: Capacitor 8 requires Node 22+, found $(node --version)"
          exit 1
        fi
        XCODE_MAJOR=$(xcodebuild -version | head -1 | sed -E 's/Xcode ([0-9]+).*/\1/')
        if [ "$XCODE_MAJOR" -lt 26 ]; then
          echo "ERROR: Capacitor 8 requires Xcode 26.0+, found $(xcodebuild -version | head -1)"
          exit 1
        fi

    - &install_dependencies
      name: Install dependencies
      script: |
        set -e
        # package.json lives at the repository root, alongside capacitor.config.json.
        npm ci

    - &run_tests
      name: Run the regression suite
      script: |
        set -e
        # The full suite must pass before any native work is attempted.
        npm test

    - &assert_native_storage_off
      name: Assert native SQLite storage stays disabled
      script: |
        set -e
        # Gate 5 validates that the native project builds, NOT that learner data moves.
        # The persistence bootstrap must still default to IndexedDB.
        BOOTSTRAP=01_APPLICATION/CURRENT_APP/src/platform/bootstrap-persistence.js
        if ! grep -q "nativeStorageEnabled = false" "$BOOTSTRAP"; then
          echo "ERROR: nativeStorageEnabled is no longer defaulted to false in $BOOTSTRAP"
          exit 1
        fi
        echo "OK: nativeStorageEnabled defaults to false (IndexedDB remains active)"

    - &generate_ios_platform
      name: Generate the Capacitor iOS platform
      script: |
        set -e
        # Uses the committed capacitor.config.json (appId, webDir, CapacitorSQLite config).
        npx cap --version
        if [ -d ios ]; then
          echo "ios/ already present, reusing it"
        else
          npx cap add ios
        fi

    - &sync_ios
      name: Sync web assets and native dependencies
      script: |
        set -e
        # cap sync copies webDir into the native project and regenerates
        # ios/App/CapApp-SPM/Package.swift with every SPM-capable plugin.
        npx cap sync ios

    - &verify_native_integration
      name: Verify SPM integration and web assets
      script: |
        set -e
        PKG=ios/App/CapApp-SPM/Package.swift
        PROJ=ios/App/App.xcodeproj

        test -f "$PKG" || { echo "ERROR: $PKG missing; the SPM project was not generated"; exit 1; }
        test -d "$PROJ" || { echo "ERROR: $PROJ missing; the Xcode project was not generated"; exit 1; }
        echo "OK: SPM project generated"

        echo "--- generated Package.swift ---"
        cat "$PKG"
        echo "-------------------------------"

        # The plugin must be declared as a package dependency. The Capacitor CLI writes
        # .package(name: "<iosName>", path: "...") for each SPM-capable plugin, and the
        # iOS package name for @capacitor-community/sqlite is CapacitorCommunitySqlite
        # (matching the product/library name in that plugin's own Package.swift).
        if ! grep -q 'package(name: "CapacitorCommunitySqlite"' "$PKG"; then
          echo "ERROR: @capacitor-community/sqlite is not in the SPM dependency graph."
          echo "The Capacitor CLI only WARNS when a plugin lacks SPM support, so this must fail here."
          exit 1
        fi
        echo "OK: CapacitorCommunitySqlite declared as an SPM package dependency"

        # Declaring it is not enough: it must also be linked into the app target.
        if ! grep -q 'product(name: "CapacitorCommunitySqlite", package: "CapacitorCommunitySqlite")' "$PKG"; then
          echo "ERROR: CapacitorCommunitySqlite is declared but not linked to the CapApp-SPM target"
          exit 1
        fi
        echo "OK: CapacitorCommunitySqlite linked to the app target"

        # An SPM project should carry no CocoaPods artefacts.
        if [ -f ios/App/Podfile ] || [ -d ios/App/App.xcworkspace ]; then
          echo "WARNING: CocoaPods artefacts found in what should be an SPM project"
        fi

        # The web assets must have been copied into the native bundle.
        test -f ios/App/App/public/index.html || {
          echo "ERROR: web assets were not copied into the iOS project"; exit 1;
        }
        echo "OK: web assets copied from 01_APPLICATION/CURRENT_APP"

    - &resolve_packages
      name: Resolve Swift package dependencies
      script: |
        set -e
        # Fetches capacitor-swift-pm plus the plugin's transitive packages
        # (SQLCipher.swift, ZIPFoundation) before the compile step.
        xcodebuild -resolvePackageDependencies \
          -project ios/App/App.xcodeproj \
          -scheme App \
          -clonedSourcePackagesDirPath build/spm-cache

    - &compile_unsigned
      name: Compile the iOS project (unsigned)
      script: |
        set -e
        # Simulator SDK plus disabled code signing, so this validates that the project
        # compiles without any Apple credentials. An SPM project has no .xcworkspace,
        # so this targets App.xcodeproj directly.
        xcodebuild \
          -project ios/App/App.xcodeproj \
          -scheme App \
          -configuration Debug \
          -sdk iphonesimulator \
          -destination 'generic/platform=iOS Simulator' \
          -derivedDataPath build/ios-derived \
          -clonedSourcePackagesDirPath build/spm-cache \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          build | tee build/xcodebuild.log
        echo "OK: Xcode project compiled"

    - &boot_simulator
      name: Boot an iOS Simulator
      script: |
        set -e
        # Pick an available iPad first (iPad is the primary target), otherwise an iPhone.
        # Device names differ between Xcode images, so the runtime list is queried rather
        # than assuming a specific model.
        xcrun simctl list devices available
        UDID=$(xcrun simctl list devices available -j | node -e '
          let raw = "";
          process.stdin.on("data", d => raw += d);
          process.stdin.on("end", () => {
            const all = Object.values(JSON.parse(raw).devices).flat().filter(d => d.isAvailable);
            const pick = all.find(d => /iPad/i.test(d.name)) || all.find(d => /iPhone/i.test(d.name));
            if (!pick) { console.error("No available simulator"); process.exit(1); }
            process.stderr.write("Selected simulator: " + pick.name + "\n");
            process.stdout.write(pick.udid);
          });
        ')
        test -n "$UDID" || { echo "ERROR: no simulator UDID"; exit 1; }
        echo "SIMULATOR_UDID=$UDID" >> "$CM_ENV"
        xcrun simctl boot "$UDID" || true
        xcrun simctl bootstatus "$UDID" -b

    - &build_for_simulator
      name: Build the app for the simulator
      script: |
        set -e
        xcodebuild \
          -project ios/App/App.xcodeproj \
          -scheme App \
          -configuration Debug \
          -sdk iphonesimulator \
          -destination "id=$SIMULATOR_UDID" \
          -derivedDataPath build/ios-derived \
          -clonedSourcePackagesDirPath build/spm-cache \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          build | tee build/xcodebuild-simulator.log
        APP_PATH=$(find build/ios-derived/Build/Products -maxdepth 2 -name "App.app" -type d | head -1)
        test -n "$APP_PATH" || { echo "ERROR: built App.app not found"; exit 1; }
        echo "APP_PATH=$APP_PATH" >> "$CM_ENV"
        echo "Built: $APP_PATH"

    - &install_and_launch
      name: Install the app and verify it launches
      script: |
        set -e
        BUNDLE_ID=$(node -p "require('./capacitor.config.json').appId")
        echo "BUNDLE_ID=$BUNDLE_ID" >> "$CM_ENV"

        xcrun simctl install "$SIMULATOR_UDID" "$APP_PATH"
        echo "OK: app installed"

        # Launch the REAL app (its own index.html) and confirm the process stays alive,
        # which means the WebView booted rather than crashing on startup.
        xcrun simctl launch "$SIMULATOR_UDID" "$BUNDLE_ID"
        sleep 12
        if ! xcrun simctl spawn "$SIMULATOR_UDID" launchctl list | grep -q "$BUNDLE_ID"; then
          echo "ERROR: the app is not running after launch"; exit 1
        fi
        echo "OK: real app launched and still running"

        # Offline-first: the simulator has no server for the app's own assets, they are
        # bundled. Confirm the bundled web assets are what the app loads.
        DATA_DIR=$(xcrun simctl get_app_container "$SIMULATOR_UDID" "$BUNDLE_ID" data)
        echo "APP_DATA_DIR=$DATA_DIR" >> "$CM_ENV"
        test -f "$APP_PATH/public/index.html" || { echo "ERROR: bundled web assets missing"; exit 1; }
        test -f "$APP_PATH/public/vendor/capacitor-sqlite.js" \
          || { echo "ERROR: vendored SQLite bundle missing from the app"; exit 1; }
        echo "OK: web assets and vendored SQLite bundle are inside the app bundle"

        xcrun simctl terminate "$SIMULATOR_UDID" "$BUNDLE_ID" || true

    - &run_simulator_validation
      name: Validate native SQLite and first-launch migration on device
      script: |
        set -e
        # Swap in the CI-only harness. It is copied INTO THE INSTALLED BUNDLE, so the
        # production web app in the repository is never modified.
        INSTALLED_APP=$(xcrun simctl get_app_container "$SIMULATOR_UDID" "$BUNDLE_ID" app)
        cp "$INSTALLED_APP/public/index.html" "$INSTALLED_APP/public/index.real.html"
        cp tools/simulator-validation/harness.js "$INSTALLED_APP/public/validation-harness.js"
        cp tools/simulator-validation/index.html "$INSTALLED_APP/public/index.html"

        run_phase() {
          echo "--- launching validation phase $1 ---"
          xcrun simctl launch "$SIMULATOR_UDID" "$BUNDLE_ID"
          sleep 25
          xcrun simctl terminate "$SIMULATOR_UDID" "$BUNDLE_ID" || true
          sleep 2
        }
        # Phase 1 seeds and migrates; phase 2 runs after a real process termination and
        # is what proves the data survived.
        run_phase 1
        run_phase 2

        # Restore the real entry point so nothing downstream sees the harness.
        mv "$INSTALLED_APP/public/index.real.html" "$INSTALLED_APP/public/index.html"
        rm -f "$INSTALLED_APP/public/validation-harness.js"

    - &assert_validation_results
      name: Assert simulator validation results
      script: |
        set -e
        DB_DIR="$APP_DATA_DIR/Library/CapacitorDatabase"
        DB="$DB_DIR/deutschflow_validationSQLite.db"

        echo "--- native database location ---"
        ls -la "$DB_DIR" || { echo "ERROR: $DB_DIR does not exist"; exit 1; }
        test -f "$DB" || { echo "ERROR: validation database not found at $DB"; exit 1; }
        echo "OK: database stored at the configured iosDatabaseLocation"

        # The learner's production database must NOT have been created by validation.
        if [ -f "$DB_DIR/deutschflowSQLite.db" ]; then
          echo "ERROR: the production database was created during validation"; exit 1
        fi
        echo "OK: production database untouched"

        echo "--- validation results ---"
        sqlite3 "$DB" "SELECT phase, passed, name, COALESCE(detail,'') FROM df_validation_results ORDER BY phase, name;"

        TOTAL=$(sqlite3 "$DB" "SELECT COUNT(*) FROM df_validation_results;")
        FAILED=$(sqlite3 "$DB" "SELECT COUNT(*) FROM df_validation_results WHERE passed = 0;")
        PHASE1=$(sqlite3 "$DB" "SELECT COUNT(*) FROM df_validation_results WHERE phase = 1;")
        PHASE2=$(sqlite3 "$DB" "SELECT COUNT(*) FROM df_validation_results WHERE phase = 2;")

        echo "checks=$TOTAL failed=$FAILED phase1=$PHASE1 phase2=$PHASE2"
        [ "$TOTAL" -gt 0 ]   || { echo "ERROR: the harness recorded no results"; exit 1; }
        [ "$PHASE1" -gt 0 ]  || { echo "ERROR: phase 1 did not run"; exit 1; }
        [ "$PHASE2" -gt 0 ]  || { echo "ERROR: phase 2 did not run, persistence unproven"; exit 1; }
        [ "$FAILED" -eq 0 ]  || { echo "ERROR: $FAILED validation checks failed"; exit 1; }
        echo "OK: all $TOTAL simulator validation checks passed"

workflows:
  ios-capacitor-validation:
    name: iOS Capacitor Validation (unsigned)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      # Capacitor 8 minimums: Xcode 26.0+, Node 22+.
      # No cocoapods key: the generated project is Swift Package Manager based.
      xcode: 26.4
      node: 22
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: mobile-foundation
          include: true
          source: true
    scripts:
      - *verify_toolchain
      - *install_dependencies
      - *run_tests
      - *assert_native_storage_off
      - name: Prepare build output directory
        script: mkdir -p build
      - *generate_ios_platform
      - *sync_ios
      - *verify_native_integration
      - *resolve_packages
      - *compile_unsigned
      - *boot_simulator
      - *build_for_simulator
      - *install_and_launch
      - *run_simulator_validation
      - *assert_validation_results
    artifacts:
      - build/xcodebuild.log
      - build/xcodebuild-simulator.log
      - ios/App/CapApp-SPM/Package.swift
    publishing:
      email:
        recipients:
          - mohammedyoussef8187@gmail.com
        notify:
          success: true
          failure: true

  # Not triggered automatically. Enable only after Apple signing credentials are
  # configured in Codemagic (ios_signing certificate + provisioning profile, and a
  # real bundle identifier replacing the com.deutschflow.app placeholder).
  ios-signed-device-build:
    name: iOS Signed Device Build (requires Apple credentials)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: 26.4
      node: 22
      groups:
        - appstore_credentials
      ios_signing:
        distribution_type: development
        bundle_identifier: com.deutschflow.app
    scripts:
      - *verify_toolchain
      - *install_dependencies
      - *run_tests
      - *assert_native_storage_off
      - name: Prepare build output directory
        script: mkdir -p build
      - *generate_ios_platform
      - *sync_ios
      - *verify_native_integration
      - *resolve_packages
      - name: Apply signing profiles
        script: xcode-project use-profiles
      - name: Build signed .ipa
        script: |
          set -e
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
